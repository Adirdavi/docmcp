# Rename `app` if the name is taken, then set BASE_URL below to match exactly —
# it is baked into every download link handed to a client.
app = "docmcp"
primary_region = "fra"

[build]

[env]
  PORT = "8787"
  BASE_URL = "https://docmcp.fly.dev"
  DB_PATH = "/data/docmcp.db"
  OUT_DIR = "/data/out"

# Without this mount the key database is wiped on every deploy and every paying
# customer's key stops working. Create it first: fly volumes create data --size 1
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine only: a single SQLite file on a single volume cannot be shared.
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
